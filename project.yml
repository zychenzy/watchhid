name: WatchHID
options:
  bundleIdPrefix: com.zy.watchhid
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "47R73Z2HQT"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"

targets:
  WatchHID:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Shared
    dependencies:
      - target: WatchHIDWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.watchhid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "WatchHID scans for the Watch Mouse BLE advertisement during R1 tests."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "WatchHID uses Bluetooth to verify Watch Mouse advertising."
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/WatchHID.entitlements
        SUPPORTS_MACCATALYST: NO

  WatchHIDWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.watchhid.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/Watch/Info.plist
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.zy.watchhid
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "WatchHID probes BLE peripheral advertising so the watch can appear as Watch Mouse."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "WatchHID probes BLE peripheral advertising so the watch can appear as Watch Mouse."
        CODE_SIGN_ENTITLEMENTS: Apps/Watch/WatchHIDWatch.entitlements
        WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: Apps/Watch/WatchHIDWatch-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES

schemes:
  WatchHID:
    build:
      targets:
        WatchHID: all
        WatchHIDWatchApp: all
  WatchHIDWatchApp:
    build:
      targets:
        WatchHIDWatchApp: all
