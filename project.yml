name: WatchHID
options:
  bundleIdPrefix: com.zy.watchhid
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Real team lives in gitignored Config/Developer.xcconfig
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"

targets:
  WatchHIDWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
      - path: Shared
    configFiles:
      Debug: Config/Developer.xcconfig
      Release: Config/Developer.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.watchhid.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/Watch/Info.plist
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "WatchHID probes BLE peripheral advertising so the watch can appear as Watch Mouse."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "WatchHID probes BLE peripheral advertising so the watch can appear as Watch Mouse."
        CODE_SIGN_ENTITLEMENTS: Apps/Watch/WatchHIDWatch.entitlements
        SKIP_INSTALL: NO
        SWIFT_OBJC_BRIDGING_HEADER: Apps/Watch/WatchHIDWatch-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES

  WatchHIDUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: Tests/WatchHIDUITests
    dependencies:
      - target: WatchHIDWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.watchhid.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WatchHIDWatchApp

schemes:
  WatchHIDWatchApp:
    build:
      targets:
        WatchHIDWatchApp: all

  WatchHIDSimulatorChecks:
    build:
      targets:
        WatchHIDWatchApp: all
        WatchHIDUITests: [test]
    test:
      targets:
        - WatchHIDUITests
